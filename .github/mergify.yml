queue_rules:
  - name: default
    merge_method: rebase
    batch_size:
      min: 1
      max: 8
    batch_max_wait_time: "2 minutes"
    merge_conditions:
      - check-success=Check Flake

pull_request_rules:
  - name: Queue when labeled and all CI jobs pass
    conditions:
      - and:
          - label=dependencies
          - check-success=Check Flake
    actions:
      queue:
        name: default
