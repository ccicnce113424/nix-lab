queue_rules:
  - name: default
    merge_method: rebase
    queue_conditions:
      - check-success=Check Flake
    merge_conditions:
      - check-success=Check Flake
    batch_size:
      min: 1
      max: 8

pull_request_rules:
  - name: Queue when labeled
    conditions:
      - and:
          - label=dependencies
          - base=main
    actions:
      queue:
        name: default
